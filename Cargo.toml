[package]
name = "cosmic-ext-applet-colorpicker"
version = "1.1.0"
edition = "2024"
authors = ["Fred Silveyra"]
description = "Color picker applet for the COSMIC™ desktop panel"
repository = "https://github.com/FredSilveyra/cosmic-ext-applet-colorpicker"
license = "GPL-3.0-or-later"
keywords = ["cosmic", "wayland", "applet", "color-picker", "eyedropper"]
categories = ["desktop-environment"]

[build-dependencies]
xdgen = "0.1"

[dependencies]
# Original Dependencies
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }

# New Dependencies for Color Picker
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Loupe picker: screenshot via xdg-desktop-portal (COSMIC portal) and decoding
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
