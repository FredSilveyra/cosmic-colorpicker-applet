name: Feature request
description: Suggest an idea for the applet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Alternatives you considered, or how other tools handle this.
